# Ejecuta todos los cuadernos de principio a fin para detectar errores
# o cambios incompatibles en las dependencias.
name: Cuadernos

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # todos los lunes a las 6:00 (UTC)
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias (las mismas que el dev container)
        run: bash .devcontainer/post-create.sh

      - name: Instalar herramientas de prueba
        run: pip install --user pytest nbmake

      - name: Ejecutar los cuadernos
        run: python -m pytest --nbmake --nbmake-timeout=1800 code
