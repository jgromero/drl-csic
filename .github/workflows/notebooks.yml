# Ejecuta todos los cuadernos de principio a fin para detectar errores
# o cambios incompatibles en las dependencias.
# Se lanza a mano desde GitHub: Actions > Cuadernos > Run workflow.
name: Cuadernos

on:
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias (las mismas que la imagen Docker) y herramientas de prueba
        run: pip install -r requirements-dev.txt

      - name: Ejecutar los cuadernos
        run: python -m pytest --nbmake --nbmake-timeout=1800 code
